<meta charset="utf-8">
<script>
  // 課程網址已改成 Cloudflare Pages（GitHub Pages 在台灣太慢）：舊的 github.io 網址轉到同一頁，保留 #t= 等片段
  if (location.hostname.endsWith("github.io")) {
    location.replace("https://learning-analytics-tools.pages.dev" + (location.pathname.replace(/^\/Learning-Analytics-Tools(?=\/|$)/, "") || "/") + location.search + location.hash);
  }
</script>
<script>
  // 進入前的「連線到遠端電腦」畫面（js/connect.js）：?connect=0 或測試時跳過；在任何東西畫出來之前就決定，畫面才不會先閃一下
  (function () {
    var q = location.search, skip = /[?&](connect|welcome)=0(&|$)/.test(q);
    document.documentElement.className += skip ? " lab-noconnect" : " lab-connecting";
    // 液態玻璃的折射（SVG 位移濾鏡套在 backdrop-filter 上）只有 Chromium 系瀏覽器（Chrome、Edge）畫得出來；其他瀏覽器用較強的模糊
    try {
      var ua = navigator.userAgentData;
      if (ua && ua.brands && ua.brands.some(function (b) { return /Chromium/.test(b.brand); })) document.documentElement.className += " lab-lg";
    } catch (e) { /* ignore */ }
  })();
</script>

<body>
<!-- 液態玻璃的「水波」：分形雜訊模糊後當位移圖，把玻璃後面的畫面輕輕折彎（mission.css .lab-glass）。#lab-lg 給小玻璃（膠囊、提醒、歡迎），#lab-lg-calm 給文字多的任務卡 -->
<svg class="lab-svgdefs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <filter id="lab-lg" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="90" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="lab-lg-calm" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="1" seed="5" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<!-- 連線畫面：約 2.5 秒後由 js/connect.js 移除 -->
