<script>
  (function () {
    const vid = document.getElementById("vid");
    const btns = Array.from(document.querySelectorAll("#chapters button"));
    const starts = btns.map((b) => Number(b.dataset.t));
    function seek(t, play) {
      const go = () => { vid.currentTime = t; if (play) vid.play().catch(() => {}); };
      if (vid.readyState >= 1) go(); else vid.addEventListener("loadedmetadata", go, { once: true });
    }
    btns.forEach((b) => b.addEventListener("click", () => seek(Number(b.dataset.t), true)));
    function mark() {
      let i = 0;
      starts.forEach((s, k) => { if (vid.currentTime + 0.05 >= s) i = k; });
      btns.forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
    }
    vid.addEventListener("timeupdate", mark);
    vid.addEventListener("seeked", mark);
    mark();
    // 從 Week 3 總覽點片段進來：網址帶 #t=秒數
    const m = location.hash.match(/^#t=(\d+(?:\.\d+)?)$/);
    if (m) seek(Number(m[1]), false);
  })();
</script>
