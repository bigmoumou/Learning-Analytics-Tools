<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ boards: `<div class="sheet mini" id="vm"></div>` });
  ["zSrv", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  const D = 16;
  const DONE = 0.6, PUSH0 = 0.9, PUSH1 = 1.9, ROW0 = 2.2, ROWD = 0.6, OK7 = ROW0 + 7 * ROWD + 0.2;
  const CAM = [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, ...V.PUSH_T]];
  const CAPS = [
    [0.4, 7.4, "最後的回答：一張 7 列的表", "每一條都寫結果，也寫證據：跑了什麼、看到什麼"],
    [7.8, 15.7, "「做好了」，<em>現在有證據了</em>", ""],
  ];
  function render(t) {
    V.dip(t, D);
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k); L.dim(k, ["zMac"]);
    L.sec(t, "07", "回報表");
    const at = { tm: -1, ask: -1, work: -1, a1: -1, r1: -1, a2: -1, r2: -1, x1: -1, a3: -1, r3: -1, x2: -1, a4: -1, r4: -1, fin: DONE };
    L.thread(t, { title: () => V.TITLE2, at, doneAt: DONE });
    // 表一列一列亮起來（對照右邊驗收單的同一條）
    const on = t >= ROW0 && t < ROW0 + 7 * ROWD ? Math.floor((t - ROW0) / ROWD) : -1;
    $("cxMsgs").querySelectorAll(".rep tr").forEach((tr, i) => tr.classList.toggle("on", i - 1 === on));
    V.verify($("vm"), { marks: [["ok", 1], ["ok", 1], ["ok", 1], ["ok", 1], ["ok", 1], ["ok", 1], ["ok", C((t - OK7) / 0.4)]], hi: on });
    K.vis($("vm"), 1);
    L.illus(t, [[PUSH1, 15.7, "表裡第 3–6 條的證據是示意"]]);
    L.caps(t, CAPS);
  }
  L.start("07 回報表", D, render);
})();
</script>
