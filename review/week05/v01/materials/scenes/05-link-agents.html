<title>05 接上 AGENTS.md</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<link rel="stylesheet" href="../common/v01.css">
<style>
  #ag { left: 96px; top: 150px; width: 990px; }
  #vm { left: 1290px; top: 210px; width: 520px; }
  #lk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  #lk path { fill: none; stroke: #f0b545; stroke-width: 3; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ world: `<div class="sheet" id="ag"></div><div class="sheet mini" id="vm"></div><svg id="lk"><path id="lkP" d=""/></svg>` });
  ["zMac", "zSrv", "app", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  const D = 16;
  const ADD = 1.2, UL = 2.4, VM = 7.0, LINK0 = 7.6, LINK1 = 8.8;
  const CAPS = [
    [0.4, 6.5, "在家規加一句", "做完任何修改之後，照 VERIFY.md 逐條檢查，回報每一條的結果。"],
    [6.9, 15.7, "Codex 每段對話一開始會讀 AGENTS.md", "但不會自己去找 VERIFY.md，所以要在 AGENTS.md 叫它讀"],
  ];
  function render(t) {
    V.dip(t, D);
    L.cam(t, [[0, ...L.WIDE]]);
    L.sec(t, "05", "接上 AGENTS.md");
    V.agents($("ag"), { add: t >= ADD ? C((t - ADD) / 0.6) : 0, ul: E((t - UL) / 0.6) });
    $("ag").style.transform = "rotate(-0.4deg)";
    const a = $("agAdd");
    if (a) a.style.transform = `translateY(${((1 - K.easeOut((t - ADD) / 0.5)) * 12).toFixed(1)}px)`;
    V.verify($("vm"));
    K.vis($("vm"), C((t - VM) / 0.4));
    $("vm").style.transform = `translateY(${((1 - K.spring(t - VM, 14, 0.85)) * 20).toFixed(1)}px) rotate(0.5deg)`;
    // 細線：家規那一行的「VERIFY.md」→ 驗收單的標題
    const u = a && a.querySelector("u"), lo = E((t - LINK0) / (LINK1 - LINK0));
    if (u && lo > 0) {
      const r = L.wr(u), v = L.wr($("vm").querySelector(".ttl"));
      // 從字的下面往下，沿著家規的下緣繞過去（不穿過字），再往上接到驗收單
      const ag = L.wr($("ag")), x0 = r.x + r.w / 2, y0 = r.y + r.h + 10, yb = ag.y + ag.h + 26, x1 = v.x - 16, y1 = v.y + v.h / 2, xm = x1 - 50;
      const p = $("lkP"); p.setAttribute("d", `M ${x0} ${y0} V ${yb - 20} Q ${x0} ${yb} ${x0 + 20} ${yb} H ${xm - 20} Q ${xm} ${yb} ${xm} ${yb - 20} V ${y1 + 20} Q ${xm} ${y1} ${xm + 20} ${y1} H ${x1}`);
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - lo); p.style.opacity = 1;
    } else $("lkP").style.opacity = 0;
    L.caps(t, CAPS);
  }
  L.start("05 接上 AGENTS.md", D, render);
})();
</script>
</body>
