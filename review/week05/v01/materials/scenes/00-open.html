<title>00 開場</title>

<link rel="stylesheet" href="../../assets/kit/codex.css">

  #tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid #f0b545; opacity: 0; }
</style>

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/pins.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, lerp = K.lerp, $ = L.$;
  L.mount({ boards: `<div class="phone" id="ph"></div><div id="tap"></div>` });
  ["zSrv", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  V.WORKED = "Worked for 48s";
  const D = 18;
  const TYPE = 0.7, CPS = 18, ENTER = 3.9, DONE = 5.6, PULL0 = 7.6, PULL1 = 8.6, PH = 8.4, LOAD = 9.4, PAN0 = 11.6, PAN1 = 13.4, TAP = 14.2, POP = 14.5;
  const CAM = [[0, ...V.PUSH], [PULL0, ...V.PUSH], [PULL1, ...L.WIDE]];
  const CAPS = [
    [0.6, 4.4, "小安請 Codex 做一個銀杏散步地圖", ""],
    [4.8, 8.0, "Codex：「做好了！地圖上有 12 個景點。」", ""],
    [8.4, 11.4, "小安把網站放上網路（示意），用手機打開", ""],
    [11.8, 15.0, "還要左右捲動，照片也是破圖", ""],
    [15.2, 17.7, "它說做好了，<em>真的做好了嗎？</em>", ""],
  ];
  const PW = 330, PX = 1300, PY = 96;   // 手機外框
  function render(t) {
    V.dip(t, D);
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k);
    L.thread(t, {
      title: (tt) => tt < ENTER ? "New chat" : V.TITLE1,
      at: Object.assign({ tm: -1 }, t >= ENTER ? { ask: ENTER, work: ENTER + 0.3, fin1: DONE } : {}),
      doneAt: DONE, input: (tt) => tt < ENTER ? K.typed(L.ASK, tt, TYPE, CPS) : "",
    });
    K.vis($("zMac"), 1 - k);
    // 手機：網址列是示意；先是第一版的整頁（左右捲動），點 8 號標記 → 破圖（在區分大小寫的伺服器上實測的截圖）
    const pan = t < PAN0 ? 0 : t < PAN1 ? 230 * Math.sin(Math.PI * E((t - PAN0) / (PAN1 - PAN0))) : 0;
    const fade = t >= POP ? ["v1-390-broken08.png", C((t - POP) / 0.3)] : null;
    const g = V.screen($("ph"), { src: "v1-390-full.png", full: true, sx: pan, w: PW, url: "an.example.org/ginkgo-map", fade });
    if (fade) $("ph").querySelectorAll("img")[1].style.left = "0px", $("ph").querySelectorAll("img")[1].style.width = (PW - 24) + "px";
    const po = C((t - PH) / 0.4);
    $("ph").style.left = PX + "px"; $("ph").style.top = (PY + (1 - E(po)) * 40) + "px"; K.vis($("ph"), po);
    // 頁面還沒載入時是空白
    $("ph").querySelector(".scr").style.filter = t < LOAD ? "brightness(1.06) contrast(0.2)" : "";
    // 點 8 號標記的那一下（琥珀色的圈）
    const p8 = window.PINS.v1[7], tx = PX + 12 + p8[0] * g.k, ty = PY + 12 + g.bar + p8[1] * g.k;
    Object.assign($("tap").style, { left: tx + "px", top: ty + "px", transform: `scale(${(0.6 + 0.6 * C((t - TAP) / 0.4)).toFixed(3)})` });
    $("tap").style.opacity = C((t - TAP) / 0.12) * (1 - C((t - TAP - 0.3) / 0.3));
    // 小安：在手機旁邊；看到破圖時嚇一跳
    const fo = C((t - PH - 0.3) / 0.5);
    L.fox("foxO", 1770, 790, 0.82, "front", { alpha: fo, look: -0.6, expr: t < POP + 0.2 ? "curious" : "surprised", blink: Math.floor(t * 10) % 37 === 0 });
    L.illus(t, [[PH + 0.6, D, "網址和「放上網路」是示意；破圖是在區分大小寫的伺服器上實測的"]]);
    L.caps(t, CAPS);
  }
  L.start("00 開場", D, render);
})();
</script>
</body>
</html>
