<title>01 誰說了算</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">

<link rel="stylesheet" href="../common/v01.css">
<style>
  #q { position: absolute; font-size: 150px; font-weight: 900; color: #f0b545; line-height: 1; opacity: 0; }
  #mind { width: 520px; }
  #mind .ln::before { content: "□"; color: #8a7a5a; }
</style>

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ boards: `<div id="q">？</div><div class="sheet" id="mind" style="left:1300px;top:170px">
      <div class="hd"><span class="ttl" style="font-size:34px">小安心裡的「做好」</span></div><div class="sub">沒有寫下來</div>
      <div class="ln">照片都看得到</div><div class="ln">手機上也能看</div><div class="ln">標記點得到</div></div>` });
  ["zSrv", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  V.WORKED = "Worked for 48s";
  const D = 14;
  const PUSH0 = 0.3, PUSH1 = 1.3, Q = 1.8, MIND = 7.2;
  const CAM = [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, ...V.PUSH]];
  const CAPS = [
    [0.4, 6.8, "Codex 的「做好了」，是它自己判斷的", ""],
    [7.2, 13.7, "它不知道你心裡的「做好」長什麼樣", "所以要寫下來"],
  ];
  function render(t) {
    V.dip(t, D);
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k); L.dim(k, ["zMac"]);
    L.sec(t, "01", "誰說了算");
    L.thread(t, { title: () => V.TITLE1, at: { tm: -1, ask: -1, work: -1, fin1: -1 }, doneAt: -1 });
    // 「做好了！」旁邊一個琥珀色的問號（畫面座標：照鏡頭換算）
    const r = L.item("fin1");
    if (r) {
      const sx = 960 + (r.x + 245 - cam.cx) * cam.z, sy = 540 + (r.y - cam.cy) * cam.z - 70;
      const qa = C((t - Q) / 0.35);
      Object.assign($("q").style, { left: sx + "px", top: sy + "px", opacity: qa, transform: `translateY(${((1 - K.spring(t - Q, 12, 0.85)) * 18).toFixed(1)}px)` });
    }
    // 小安心裡的「做好」：一張沒寫出來的紙條
    K.vis($("mind"), C((t - MIND) / 0.4));
    $("mind").style.transform = `translateY(${((1 - K.spring(t - MIND, 14, 0.85)) * 20).toFixed(1)}px) rotate(0.6deg)`;
    $("mind").querySelectorAll(".ln").forEach((l, i) => { l.style.opacity = C((t - (MIND + 0.6 + i * 0.5)) / 0.3); });
    L.fox("foxO", 1560, 790, 0.82, "front", { alpha: C((t - MIND - 0.2) / 0.5), look: -0.4, expr: "curious", blink: Math.floor(t * 10) % 39 === 0 });
    L.caps(t, CAPS);
  }
  L.start("01 誰說了算", D, render);
})();
</script>
</body>
