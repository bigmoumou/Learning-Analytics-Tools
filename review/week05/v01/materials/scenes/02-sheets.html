<title>02 家規和驗收單</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<link rel="stylesheet" href="../common/v01.css">
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ world: `<div class="sheet" id="ag" style="left:96px;top:140px;width:800px"></div><div class="sheet" id="vf" style="left:1024px;top:140px;width:800px"></div>` });
  ["zMac", "zSrv", "app", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  const D = 20;
  const AG = 0.4, VF = 5.8, ROW0 = 6.5, ROWD = 0.42;
  const CAPS = [
    [0.4, 5.6, "AGENTS.md 是家規：寫「怎麼做」", "Week 3 學過：用繁中、檔案放哪、不要改什麼"],
    [6.0, 12.8, "VERIFY.md 是驗收單：寫「怎樣算做好、怎麼檢查」", ""],
    [13.2, 19.7, "OpenAI 官方也這樣建議", "把「做好是什麼、怎麼驗證」寫清楚（〈Codex Best practices〉）"],
  ];
  function render(t) {
    V.dip(t, D);
    L.cam(t, [[0, ...L.WIDE]]);
    L.sec(t, "02", "家規和驗收單");
    // 左：家規
    V.agents($("ag"));
    K.vis($("ag"), C((t - AG) / 0.35));
    $("ag").style.transform = `translateY(${((1 - K.spring(t - AG, 14, 0.85)) * 24).toFixed(1)}px) rotate(-0.4deg)`;
    // 右：驗收單，一條一條寫上去
    V.verify($("vf"), { rows: V.CHECKS.map((_, i) => C((t - (ROW0 + i * ROWD)) / 0.35)) });
    K.vis($("vf"), C((t - VF) / 0.35));
    $("vf").style.transform = `translateY(${((1 - K.spring(t - VF, 14, 0.85)) * 24).toFixed(1)}px) rotate(0.35deg)`;
    // 講到驗收單時，家規稍微退後
    const dimAg = 0.22 * (E((t - VF) / 0.6) - E((t - 13.2) / 0.6));
    $("ag").style.filter = dimAg > 0.001 ? `brightness(${(1 - dimAg).toFixed(3)})` : "";
    L.illus(t, [[VF + 0.6, 19.7, "檔名可以自己取；官方建議把「怎樣算做好、怎麼驗證」寫給 Codex"]]);
    L.caps(t, CAPS);
  }
  L.start("02 家規和驗收單", D, render);
})();
</script>
</body>
</html>
