(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ world: `<div id="ctxNote">紙條越疊越高，<br>就是 <b>context window</b> 越來越滿</div>` });
  const D = 26;
  const R18 = 0.6, DONE = 2.3, PUSH0 = 2.6, PUSH1 = 3.6, PULL0 = 8.0, PULL1 = 9.0, SRV_OUT = 9.0, PANEL = 9.6, LINK0 = 10.4, LINK1 = 11.6, BUMP = 17.0;
  const CAM = [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, ...L.PUSH], [PULL0, ...L.PUSH], [PULL1, ...L.WIDE]];
  const CAPS = [
    [0.4, 8.2, "模型回了最後一張：「做好了」", "不再請 Codex 跑東西，這一輪才結束"],
    [9.4, 16.6, "每一個工具的結果，<em>都疊進了 context window</em>", "讀很大的檔案、搜很多次，對話就滿得很快"],
    [17.0, 21.4, "你只按了一次 Enter，背後來回了 7 次", "次數是示意"],
    [21.8, 25.7, "工具不只這些", "內建瀏覽器、看圖片、更多外掛工具（MCP）"],
  ];
  function render(t) {
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k); L.dim(k, ["stack", "stackN", "net", "netL", "zSrv", "zMac", "folder", "bundle", "fly0", "fly1", "ctxNote"]);
    L.sec(t, "08", "越疊越高");
    L.thread(t, { at: { tm: -1, ask: -1, work: -1, a1: -1, r1: -1, a2: -1, r2: -1, a3: -1, p1: -1, a4: -1, r3: -1, a5: -1, r4: -1, a6: -1, r5: -1, fin: DONE }, doneAt: DONE, allowAt: -1 });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1]]);
    // 一疊紙條：17 → 18（做好了）
    const n = L.stack(t, 17, [[R18 + 1.4, 18]]);
    L.flies(t, [{ a: R18, i: 17 }]);
    L.count(t, 7); L.countBump(t, []);
    $("count").style.transform = t > BUMP && t < BUMP + 1.2 ? `translateY(${(-6 * Math.sin(C((t - BUMP) / 1.2) * Math.PI)).toFixed(1)}px)` : "";
    L.led(t, [[0, R18 + 0.2]]);
    // 伺服器退下，換成 context window 面板（影片 01 的樣子）；一條細線把整疊接到 Messages
    const so = 1 - C((t - SRV_OUT) / 0.5);
    ["srv", "led", "net", "netL"].forEach((id) => { $(id).style.opacity = id === "led" ? Math.min(+$("led").style.opacity || 0, so) : so; });
    L.panel(t, PANEL, K.lerp(52, 61, E((t - PANEL - 0.4) / 1.4)));
    L.link(E((t - LINK0) / (LINK1 - LINK0)), n);
    K.fade($("ctxNote"), t, LINK1);
    L.illus(t, [[PANEL + 0.2, 25.7, "面板是示意圖（借用 Claude Code 的 /context）：Codex 看不到這張表"]]);
    L.caps(t, CAPS);
  }
  L.start("08 越疊越高", D, render);
})();
</script>
