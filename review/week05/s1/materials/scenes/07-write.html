<div id="viewport"><div id="stage"></div></div>

<script src="../common/loop.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount();
  const D = 20;
  const FROM_CODEX = { x: 560, y: 470 };
  const R16 = 0.4, A6 = 2.0, R5 = 2.4, ADD17 = 3.0, SEND7 = 4.8, BOX0 = 6.8;
  const CAM = [[0, ...L.WIDE]];   // 不推近：Project 那一行加框就夠清楚（推近會壓到字幕）
  const CAPS = [
    [0.4, 6.4, "最後，模型請 Codex 寫出 <code>report.md</code>", "Codex 只在 Project 這個資料夾裡寫"],
    [6.8, 12.8, "要寫到 Project 外面，Codex 會先問你", "預設的沙箱：只能改工作資料夾裡的檔案"],
    [13.2, 19.7, "所以，要在正確的專案裡開工", "Week 3 學過：先選對資料夾，再開始對話"],
  ];
  function render(t) {
    const cam = L.cam(t, CAM);
    L.sec(t, "07", "寫檔案");
    L.thread(t, { at: { tm: -1, ask: -1, work: -1, a1: -1, r1: -1, a2: -1, r2: -1, a3: -1, p1: -1, a4: -1, r3: -1, a5: -1, r4: -1, a6: A6, r5: R5 }, allowAt: -1 });
    // Project 資料夾：report.md 出現；外面一圈琥珀色細框「Codex 只在這裡面寫」
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", R5 + 0.2, 6.6]], E((t - BOX0) / 0.5) * (1 - E((t - (D - 0.6)) / 0.4)));
    // 一疊紙條：15 → 16（請寫 report.md）→ 17（已寫入）；第 7 次傳送
    L.stack(t, 15, [[R16 + 1.4, 16], [ADD17 + 1.2, 17]]);
    L.flies(t, [{ a: R16, i: 15 }, { a: ADD17, i: 16, from: FROM_CODEX, d: 1.2, s0: 0.6, arc: 30 }]);
    const c = L.sends(t, [[SEND7, 17]], 6);
    L.count(t, c); L.countBump(t, [SEND7]);
    L.led(t, [[0, R16 + 0.2], [SEND7 + L.FLY, 1e9]]);
    L.caps(t, CAPS);
  }
  L.start("07 寫檔案", D, render);
})();
</script>
