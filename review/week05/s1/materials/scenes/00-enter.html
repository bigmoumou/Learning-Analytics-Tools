<title>00 按下 Enter</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<style>
  /* 快轉的計時：右上角，琥珀色數字 */
  #ff { position: absolute; right: 48px; top: 50px; font-size: 30px; font-weight: 700; color: #e6e6e6; white-space: nowrap; }
  #ff b { font-family: "Cascadia Mono", monospace; font-size: 40px; color: #f0b545; margin-left: 14px; vertical-align: -3px; }
  #ff small { margin-left: 14px; font-size: 24px; font-weight: 500; color: #8a95a6; vertical-align: 3px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/loop.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, lerp = K.lerp, $ = L.$;
  L.mount({ boards: `<div id="ff">快轉<b id="ffT">0:00</b><small>按下 Enter 之後</small></div>` });
  const D = 14;
  const TYPE = 0.8, CPS = 14, ENTER = 4.5, FF0 = 5.0, FF1 = 9.4, SHRINK0 = 10.6, SHRINK1 = 12.2, RESET = 11.2;
  // 大視窗（讀得到小安打的字）→ 縮回第 1 段的位置
  const BIG = { x: 48, y: 118, s: 0.66 }, SMALL = { x: 48, y: 150, s: 0.38 };
  // 快轉：一下子跑完整輪，最後收成 Worked for 30s 和最後的回答
  const ff = (i) => FF0 + i * 0.36;
  const DONE = FF1 - 0.1;
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]);
    ["zMac", "zSrv", "srv", "net", "netL", "stack", "stackN", "folder"].forEach((id) => K.vis($(id), 0));
    const g = E((t - SHRINK0) / (SHRINK1 - SHRINK0));
    const pos = { x: lerp(BIG.x, SMALL.x, g), y: lerp(BIG.y, SMALL.y, g) }, scale = lerp(BIG.s, SMALL.s, g);
    const reset = t >= RESET;
    const at = reset ? { tm: -1, ask: -1, work: -1 }
      : Object.assign({ tm: -1 }, t >= ENTER ? { ask: ENTER, work: ENTER + 0.4 } : {},
        { a1: ff(0), r1: ff(1), a2: ff(2), r2: ff(3), a3: ff(4), p1: ff(5), a4: ff(6), r3: ff(7), a5: ff(8), r4: ff(9), a6: ff(10), r5: ff(11), fin: DONE });
    L.thread(t, {
      at, doneAt: reset ? undefined : DONE, allowAt: -1, scale, pos,
      title: (tt) => tt < ENTER ? "New chat" : "課程問卷報告",
      input: (tt) => tt < ENTER ? K.typed(L.ASK, tt, TYPE, CPS) : "",
    });
    // 倒帶：縮回去的時候，對話回到「剛按下 Enter」
    $("app").style.opacity = 1 - 0.7 * C(1 - Math.abs(t - RESET) / 0.35);
    // 快轉計時：0:00 → 0:30
    const sec = Math.round(30 * C((t - FF0) / (FF1 - FF0)));
    $("ffT").textContent = `0:${String(sec).padStart(2, "0")}`;
    K.vis($("ff"), C((t - FF0 + 0.3) / 0.3) * (1 - C((t - SHRINK0) / 0.4)));
    // 小安：站在 Mac 旁邊；按 Enter 時點頭
    const fx = lerp(1600, 1000, g), fy = lerp(842, 600, g), fs = lerp(1.15, 0.78, g);
    const nod = Math.max(0, Math.sin(C((t - ENTER + 0.1) / 0.5) * Math.PI)) * 0.5;
    const expr = t < ENTER ? "curious" : t < FF1 + 0.6 && t > FF1 - 0.2 ? "happy" : t >= ENTER && t < FF0 + 0.4 ? "happy" : "neutral";
    L.fox("foxW", fx, fy, fs, "front", { look: -0.55, nod, expr, blink: Math.floor(t * 10) % 37 === 0, alpha: C(t / 0.4) });
    L.caps(t, [[SHRINK1 - 0.6, 13.9, "這 30 秒裡，發生了什麼？", ""]]);
  }
  L.start("00 按下 Enter", D, render);
})();
</script>
</body>
</html>
