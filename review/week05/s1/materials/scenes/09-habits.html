<title>09 三個好習慣</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<style>
  #habits { position: absolute; left: 80px; top: 190px; width: 1240px; }
  .hb { display: grid; grid-template-columns: 96px 1fr; padding: 34px 0 34px; border-top: 1px solid #2b3646; }
  .hb:last-child { border-bottom: 1px solid #2b3646; }
  .hb .n { font-family: "Cascadia Mono", monospace; font-size: 56px; font-weight: 700; color: #f0b545; line-height: 1.1; }
  .hb .a { font-size: 44px; font-weight: 900; color: #fff; line-height: 1.3; white-space: nowrap; }
  .hb .b { margin-top: 8px; font-size: 30px; color: #aeb8c6; white-space: nowrap; }
  #win { position: absolute; left: 80px; top: 900px; font-size: 30px; color: #aeb8c6; white-space: nowrap; }
  #rule { position: absolute; left: 80px; top: 870px; width: 900px; height: 2px; background: #3a4556; transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/loop.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  const H = [
    ["點開 Codex 的活動紀錄", "看它跑了哪些指令"],
    ["網路查到的東西，請它附上來源網址", "自己點開確認"],
    ["允許連網、動資料夾外的東西之前", "先看清楚"],
  ];
  L.mount({
    boards: `<div class="board" id="board"><div id="habits">` + H.map(([a, b], i) => `<div class="hb" id="hb${i}"><span class="n">${i + 1}</span><div><div class="a">${a}</div><div class="b">${b}</div></div></div>`).join("") +
      `</div><div id="rule"></div><div id="win">Windows 上指令名稱不一樣（PowerShell），流程一樣。</div></div>`,
  });
  const D = 24;
  const HB = [1.4, 6.2, 11.0], WIN = 16.4;
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]);
    // 前一段的場景（一疊 18 張、面板）退下，換成結尾
    L.thread(t, { at: { tm: -1, ask: -1, work: -1, fin: -1 }, doneAt: -1 });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1]]);
    L.stack(t, 18, []);
    ["srv", "net", "netL", "led"].forEach((id) => { $(id).style.opacity = 0; });
    L.panel(-1, -9, 61);
    $("world").style.opacity = 1 - C(t / 0.6);
    K.vis($("board"), C((t - 0.4) / 0.5));
    L.sec(t, "09", "三個好習慣", 0.5);
    H.forEach((_, i) => K.rise($("hb" + i), t, HB[i], 1e9, 20));
    $("rule").style.transform = `scaleX(${E((t - WIN) / 0.7).toFixed(4)})`;
    K.rise($("win"), t, WIN + 0.3, 1e9, 12);
    // 小安：在右邊，開心地點頭（每出現一條點一下）
    const nod = HB.concat([WIN]).reduce((s, a) => s + Math.max(0, Math.sin(C((t - a - 0.2) / 0.6) * Math.PI)) * 0.35, 0);
    L.fox("foxO", 1600, 900, 1.25, "front", { alpha: C((t - 0.6) / 0.5), look: -0.35, nod, expr: "happy", blink: Math.floor(t * 10) % 47 === 0 });
  }
  L.start("09 三個好習慣", D, render);
})();
</script>
</body>
</html>
