<title>05 下載資料</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<style>
  .cmp { position: absolute; font-size: 28px; color: #aeb8c6; white-space: nowrap; line-height: 1.45; }
  .cmp b { color: #f0b545; font-weight: 800; margin-right: 12px; }
  #askNote { position: absolute; font-size: 24px; color: #8a95a6; white-space: nowrap; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/loop.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({
    world: `<div class="cmp" id="cmpL" style="left:48px;top:690px"><b>下載</b>在小安的 Mac 上跑：要她允許</div>` +
      `<div class="cmp" id="cmpR" style="left:1610px;top:520px"><b>搜尋</b>在這裡做<br>不用允許</div>`,
    boards: `<div id="askNote">允許提示是示意</div>`,
  });
  const D = 28;
  const FROM_CODEX = { x: 560, y: 470 };
  const R10 = 0.4, A3 = 2.0, ASK = 2.9, PUSH0 = 2.4, PUSH1 = 3.4, LOOK = 5.2, UL0 = 5.6, UL1 = 6.6, CLICK = 10.4, ALLOW = 10.7, X3 = 11.3, PULL0 = 16.0, PULL1 = 17.0, ADD11 = 17.2, SEND4 = 19.0, CMP = 20.4;
  const CAM = [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, ...L.PUSH], [PULL0, ...L.PUSH], [PULL1, ...L.WIDE]];
  const CAPS = [
    [0.4, 4.4, "下載要連網：Codex 先停下來問小安", "預設的沙箱不能連網"],
    [4.8, 10.6, "按之前，先看清楚：它要連去哪、下載什麼", "這裡是從 <code>example.org</code> 下載 <code>survey.csv</code>"],
    [11.0, 16.4, "小安允許了，Codex 才在她的 Mac 上下載", "下載是 Codex 在你電腦上跑的終端機指令（<code>curl</code>）"],
    [17.2, 27.7, "搜尋在 OpenAI 那邊，下載在你的電腦", "所以搜尋不用允許，下載要你允許"],
  ];
  function render(t) {
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k); L.dim(k, ["stack", "stackN", "net", "netL", "srv", "zSrv", "zMac", "folder", "bundle", "led", "fly0", "fly1", "cmpL", "cmpR"]);
    L.sec(t, "05", "下載資料");
    L.thread(t, {
      at: { tm: -1, ask: -1, work: -1, a1: -1, r1: -1, a2: -1, r2: -1, a3: A3, p1: ASK, x3: X3 },
      allowAt: ALLOW, pressAt: CLICK, ul: (tt) => E((tt - UL0) / (UL1 - UL0)),
    });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", X3 + 0.4, PULL1 + 2.6]]);
    // 一疊紙條：9 → 10（模型：請跑 curl）→ 11（已下載）
    L.stack(t, 9, [[R10 + 1.4, 10], [ADD11 + 1.2, 11]]);
    L.flies(t, [{ a: R10, i: 9 }, { a: ADD11, i: 10, from: FROM_CODEX, d: 1.2, s0: 0.6, arc: 30 }]);
    const c = L.sends(t, [[SEND4, 11]], 3);
    L.count(t, c); L.countBump(t, [SEND4]);
    L.led(t, [[0, R10 + 0.2], [SEND4 + L.FLY, 1e9]]);
    // 游標：先停在網址上，再按「允許」（#world 座標，跟著對話欄的位置算）
    const ask = $("cxMsgs").querySelector(".ask");
    if (ask && t < ALLOW + 0.4) {
      const u = L.wr(ask.querySelector("u")), y = L.wr(ask.querySelector(".yes"));
      L.cursor(t, [[LOOK - 0.3, u.x + u.w + 30, u.y + 60], [LOOK + 0.4, u.x + u.w * 0.55, u.y + u.h * 0.7], [UL1 + 2.6, u.x + u.w * 0.62, u.y + u.h * 0.7], [CLICK - 0.1, y.x + y.w * 0.5, y.y + y.h * 0.6], [ALLOW + 0.4, y.x + y.w * 0.5, y.y + y.h * 0.6]], [CLICK]);
      // 「示意」標在提示的右邊（畫面座標）
      const s = L.wr(ask), sx = 960 + (s.x + s.w - cam.cx) * cam.z + 24, sy = 540 + (s.y - cam.cy) * cam.z + 8;
      Object.assign($("askNote").style, { left: sx + "px", top: sy + "px" });
    } else L.cursor(t, null);
    K.vis($("askNote"), C((t - ASK - 0.6) / 0.3) * (1 - C((t - ALLOW) / 0.3)));
    // 小安：推近時從右下角出現，看提示；按下允許後點頭，再離開
    const fo = C((t - (PUSH1 - 0.2)) / 0.5) * (1 - C((t - (PULL0 - 0.4)) / 0.5));
    const nod = Math.max(0, Math.sin(C((t - CLICK) / 0.6) * Math.PI)) * 0.45;
    L.fox("foxO", 1760, 1050 + 40 * (1 - E(fo)), 1.0, "front", { alpha: fo, look: -0.7, nod, expr: t < CLICK ? "curious" : "happy", blink: Math.floor(t * 10) % 43 === 0 });
    // 最後：搜尋和下載的對比
    K.rise($("cmpL"), t, CMP); K.rise($("cmpR"), t, CMP + 0.6);
    L.illus(t, [[ASK, PULL0, "網址是示意；survey.csv 是自己做的假資料"]]);
    L.caps(t, CAPS);
  }
  L.start("05 下載資料", D, render);
})();
</script>
</body>
</html>
