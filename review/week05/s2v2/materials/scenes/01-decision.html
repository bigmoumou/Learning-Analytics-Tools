<title>01 一開始的決定</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp;
  L.mount();
  const D = 12;
  // 第 2 版：全片從這裡開始（拿掉預告）。14:00 新對話「分析成績」。
  // 回覆那張先落下、在最上面停一下 → 推近讀那句決定（有字幕、底線一邊畫）→ 拉回 →「好」疊上去 → 畫圖、寫 report.md
  const ASK = 0.4, REPLY = 2.1, PUSH0 = 3.4, PUSH1 = 4.2, PULL0 = 6.5, PULL1 = 7.3, TYPE0 = 7.5, SEND = 7.9;
  const ADDS = [[ASK + 0.2, 3], [0.95, 4], [1.25, 5], [REPLY + 0.2, 6], [SEND + 0.2, 7], [8.4, 8], [8.75, 9], [9.1, 10], [9.45, 11], [9.8, 12], [10.1, 13], [10.4, 14]];   // 最後一張 10.4：新紙條的琥珀邊亮 1.6 秒，結尾前退掉（接第 2 段）
  const CAM = [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, 471, 345, 2.2], [PULL0, 471, 345, 2.2], [PULL1, ...L.WIDE]];
  const CAPS = [
    [0.3, 3.3, "下午兩點，小安請 Codex 分析成績", ""],
    [3.7, 6.9, "一開始，Codex 訂下一個決定", "缺考的 3 人，先不算進平均", 5.3],
    [8.1, 11.8, "第一張圖和 report.md，都照這個算", "小安只回了一個「好」。"],
  ];
  function render(t) {
    const cam = L.cam(t, CAM), k = L.pushK(cam.z);
    L.scrims(k); L.dim(k);
    L.sec(t, "01", "一開始的決定", 0.2);
    L.clock(14 * 60 + lerp(0, 4, C((t - 8.1) / 3.2)));
    const done1 = t >= REPLY, done2 = t >= 10.4;
    L.thread(t, {
      title: "分析成績",
      items: [
        ["tm", K.cx.time("Today 2:00 PM"), -1],
        ["ask", L.user(L.ASK), ASK],
        ["w1", L.work(done1, "Worked for 38s"), ASK + 0.2],
        ["dec", L.agent(L.DECISION), REPLY],
        ["ok", L.user("好"), SEND],
        ["w2", L.work(done2, "Worked for 1m 12s"), SEND + 0.2],
        ["r1", L.tr("pencil", "Created plot.py"), 8.4],
        ["r2", L.tr("termBox", "Ran commands"), 9.1],
        ["r3", L.tr("pencil", "Edited report.md"), 9.8],
        ["fin", L.agent(`已畫好散佈圖 ${K.cx.file("scatter.png")}，各班平均寫進 ${K.cx.file("report.md")}（缺考的 3 人不算進平均）。`), 10.4],
      ],
      input: (tt) => (tt >= TYPE0 && tt < SEND ? "好" : ""),
      ul: (tt) => E((tt - 4.4) / 1.2),           // 推近之後，那句的琥珀底線慢慢畫出來
    });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", 8.75], ["scatter.png", 9.45]]);   // 新檔名亮 2.4 秒，結尾前退掉
    L.stack(t, 2, ADDS);
    L.panel(t, -1, lerp(12, 40, E(C((t - 0.4) / 10.0))));
    L.caps2(t, CAPS);
    L.illus(t, [[0.3, PUSH0 + 0.3, "情境是示意：資料、班級、數字都是假的"], [PULL1, D + 1, L.ILLUS]]);
    L.stageFade(t, { in: true });               // 全片的開頭：從全黑淡入
  }
  L.start("01 一開始的決定", D, render);
})();
</script>
</body>
</html>
