<title>09 結尾</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
<style>
  #end { position: absolute; left: 80px; top: 300px; width: 1400px; }
  #end .core { font-size: 84px; font-weight: 900; line-height: 1.3; color: #fff; white-space: nowrap; }
  #end .core em { font-style: normal; color: #f0b545; }
  #end .rule { margin-top: 40px; width: 900px; height: 2px; background: #3a4556; transform-origin: 0 50%; }
  #end .recap { margin-top: 30px; font-size: 32px; color: #aeb8c6; white-space: nowrap; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ boards: `<div class="board" id="board"><div id="end"><div class="core" id="l1">對話不是越長越好：</div><div class="core" id="l2"><em>小而專一，重要的事寫進檔案。</em></div><div class="rule" id="rule"></div><div class="recap" id="recap">快滿會自動壓縮・壓縮可能掉細節・一件事一段對話・重要的事寫進檔案</div></div></div>` });
  const D = 8;
  // 第 2 版：大字之後加一行回顧（四個重點），每 2.5 秒內都有新的東西
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]);
    $("world").style.opacity = 0;
    K.vis($("board"), 1);
    K.rise($("l1"), t, 0.4, 1e9, 18);
    K.rise($("l2"), t, 1.4, 1e9, 18);
    $("rule").style.transform = `scaleX(${E((t - 2.2) / 0.8).toFixed(4)})`;
    K.rise($("recap"), t, 3.4, 1e9, 12);
    L.fox("foxO", 1640, 940, 1.2, "front", { alpha: C((t - 0.8) / 0.5), expr: "happy", look: -0.35, nod: 0.35 * Math.max(0, Math.sin(C((t - 1.6) / 0.7) * Math.PI)) + 0.3 * Math.max(0, Math.sin(C((t - 5.4) / 0.7) * Math.PI)), blink: Math.floor(t * 10) % 37 === 0 });
    L.stageFade(t, { out: true });
  }
  L.start("09 結尾", D, render);
})();
</script>
</body>
</html>
