<title>07 習慣一：一件事一段對話</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
<style>
  /* 第 2 版：改成 Codex app 的樣子。視窗放大到 0.78 倍，側欄和對話的字放大到推近時讀得到 */
  #win7 { position: absolute; left: 48px; top: -70px; transform: scale(.78); }
  #win7 .cx-row { height: 52px; font-size: 28px; gap: 14px; }
  #win7 .cx-row svg { width: 26px; height: 26px; }
  #win7 .cx-row.chat { padding-left: 48px; }
  #win7 .cx-row.old { opacity: .42; }
  #win7 .cx-side .brand { font-size: 30px; }
  #win7 .cx-side .section { font-size: 22px; }
  #win7 .cx-head { font-size: 26px; }
  #win7 .cx-msgs { padding-top: 250px; }
  #win7 .empty { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 36px; color: #f0f0f0; }
  #win7 .empty svg { display: block; width: 52px; height: 52px; margin: 0 auto 18px; color: #bdbdbd; }
  /* 輸入框底列的用量小圓環（Settings › General › Show context window usage 打開之後才有；事實 6）和滑過去的提示框 */
  #win7 .donut { display: inline-flex; width: 34px; height: 34px; }
  #win7 .donut svg { width: 34px; height: 34px; }
  #tip7 { position: absolute; width: 330px; transform: translateX(-50%); background: #2b2b2b; border: 1px solid #3c3c3c; border-radius: 12px; padding: 14px 18px; text-align: center;
    font-size: 30px; line-height: 1.4; color: #ececec; box-shadow: 0 10px 30px rgba(0,0,0,.45); white-space: nowrap; }
  #tip7 .l1 { opacity: .6; }
  #ring7 { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  #ring7 circle { fill: none; stroke: #f0b545; stroke-width: 3; }
  #fade7 { position: absolute; left: 0; right: 0; top: 750px; height: 40px; background: linear-gradient(rgba(15,20,27,0), #0f141b); }
  #top7 { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(#0f141b 0, #0f141b 96px, rgba(15,20,27,0) 150px); }
  .ring { display: inline-block; width: 26px; height: 26px; vertical-align: -5px; margin-right: 8px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp, cx = K.cx;
  // 同一個 Project 底下三個對話，各做一件事；舊的那段長對話留在最下面、變灰
  const CHATS = [
    { title: "分析各班平均", pct: 11, items: [L.user("算一下各班平均，缺考的人不算"), L.tr("termBox", "Ran commands"), L.agent("A 班 74.0、B 班 74.7、C 班 67.0。")] },
    { title: "畫各班平均圖", pct: 12, items: [L.user("畫一張各班平均的長條圖"), L.tr("pencil", "Created plot.py"), L.agent(`畫好了 ${cx.file("class_avg.png")}。`)] },
    { title: "改報告第二節", pct: 10, items: [L.user("把報告第二節改短一點"), L.tr("pencil", "Edited report.md"), L.agent("改好了：第二節從五段改成三段。")] },
  ];
  const OLD = "分析成績（整個下午）";
  const RING = '<svg class="ring" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#3a3a3a" stroke-width="4"/><circle cx="13" cy="13" r="10" fill="none" stroke="#aeb8c6" stroke-width="4" stroke-dasharray="15.7 62.8" transform="rotate(-90 13 13)"/></svg>';
  const donut = (pct) => `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="12" fill="none" stroke="#4a4a4a" stroke-width="4"/><circle cx="17" cy="17" r="12" fill="none" stroke="#cfcfcf" stroke-width="4" stroke-dasharray="${(75.4 * pct / 100).toFixed(1)} 75.4" transform="rotate(-90 17 17)"/></svg>`;
  L.mount({ boards: `<div class="board" id="board"><div class="app" id="win7"></div><div id="fade7"></div><div id="top7"></div><div id="tip7"></div>` +
    `<svg id="ring7" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/></svg><div class="cur" id="cur7"></div></div>` });
  const D = 17;
  // 每個對話：點進去（CLICK）、三則一則一則出現、游標滑到小圓環、提示框
  const CLICK = [1.9, 6.1, 10.3], TIP = [[3.8, 5.4], [8.0, 9.6], [12.2, 13.8]], RING_T = 14.4;
  const MAIN = "習慣一：一件事，一段對話";
  const SUBS = [[0.6, "同一個專案，開幾個對話，各做一件事", 1.4], [9.4, "一件事＝一個分析問題、一張圖、一個錯誤、報告的一節"],
    [14.0, RING + "想看用了多少：設定 › General › Show context window usage"]];
  const subAt = (t) => (SUBS.filter(([a]) => t >= a).pop() || SUBS[0]);
  const sel = (t) => CLICK.reduce((s, a, i) => (t >= a ? i : s), -1);
  let key7 = "";
  function rect(el) { const r = el.getBoundingClientRect(), s = $("stage").getBoundingClientRect(), k = s.width / 1920; return { x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k }; }
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]); L.scrims(0);
    $("world").style.opacity = 0;
    K.vis($("board"), 1);
    L.sec(t, "07", "習慣一：一件事一段對話", 0.3);
    L.clock(17 * 60 + 40, 0);
    // Codex 視窗：選了哪個對話、出現了幾則
    const s = sel(t), c = s >= 0 ? CHATS[s] : null;
    const shown = c ? c.items.filter((_, j) => t >= CLICK[s] + 0.2 + j * 0.4).length : 0;
    const key = s + "|" + shown;
    const win = $("win7");
    if (key7 !== key) {
      key7 = key;
      const chats = CHATS.map((ch, i) => ({ title: ch.title, on: i === s })).concat([{ title: OLD }]);
      win.innerHTML = K.codex({ title: c ? c.title : "Project", folders: [{ name: "game", open: false, chats: [] }, { name: "Project", open: true, chats }, { name: "日常", open: false, chats: [] }],
        recents: ["英文信件潤稿", "整理課堂筆記"], panel: false, dot: 0, messages: c ? c.items.slice(0, shown).join("") : "", model: "GPT-6 Luna Extra High" });
      win.querySelector("#cxChat1_3").classList.add("old");
      if (!c) win.querySelector("#cxMain").insertAdjacentHTML("beforeend", `<div class="empty">${K.icon("spark")}What should we work on in Project?</div>`);
      win.querySelector(".cx-composer .model").insertAdjacentHTML("beforebegin", `<span class="donut" id="dn7">${donut(c ? c.pct : 0)}</span>`);
    }
    K.setComposer(win.querySelector("#cxComposer"), "", false, t);
    // 新出現的那一則：淡入、往上浮
    win.querySelectorAll("#cxMsgs > *").forEach((el, j) => { const a = CLICK[s] + 0.2 + j * 0.4, u = t - a; el.style.opacity = C(u / 0.25); el.style.transform = u < 0.6 ? `translateY(${((1 - K.spring(u, 14, 0.85)) * 18).toFixed(1)}px)` : ""; });
    // 游標：中間 → 第一個對話 → 小圓環 → 第二個對話 → 小圓環 → … → 最後停在小圓環
    const dn = rect($("dn7")), row = (i) => rect(win.querySelector(`#cxChat1_${i}`));
    const D0 = [dn.x + dn.w / 2 + 4, dn.y + dn.h / 2 + 6], R = (i) => { const r = row(i); return [r.x + 120, r.y + r.h / 2]; };
    const PTS = [[0.9, 900, 520], [1.7, ...R(0)], [2.0, ...R(0)], [3.6, ...D0], [5.4, ...D0], [5.9, ...R(1)], [6.2, ...R(1)], [7.8, ...D0], [9.6, ...D0], [10.1, ...R(2)], [10.4, ...R(2)], [12.0, ...D0], [D - 0.3, ...D0]];
    const cu = $("cur7"), x = K.keys(t, PTS.map((p) => [p[0], p[1]])), y = K.keys(t, PTS.map((p) => [p[0], p[2]]));
    const pr = CLICK.some((a) => Math.abs(t - a) < 0.12) ? 0.88 : 1;
    cu.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${pr})`; K.vis(cu, C((t - 0.9) / 0.2));
    // 提示框（照 app 的字串，不放 token 數字）
    const tp = TIP.findIndex(([a, b]) => t >= a - 0.1 && t < b + 0.25), tip = $("tip7");
    if (tp >= 0) {
      const p = CHATS[tp].pct, h = `<div class="l1">Context window:</div><div>${p}% used (${100 - p}% left)</div>`;
      if (tip.__h !== h) { tip.innerHTML = h; tip.__h = h; }
      tip.style.left = (dn.x + dn.w / 2) + "px"; tip.style.top = (dn.y - 120) + "px";
      K.vis(tip, C((t - TIP[tp][0]) / 0.2) * (1 - C((t - TIP[tp][1]) / 0.25)));
    } else K.vis(tip, 0);
    // 最後：琥珀圈圈出小圓環（接「想看用了多少」那一行）
    const rg = $("ring7"), u = L.seg(t, RING_T, RING_T + 0.6), circ = rg.querySelector("circle");
    rg.style.left = (dn.x + dn.w / 2) + "px"; rg.style.top = (dn.y + dn.h / 2) + "px";
    circ.style.strokeDasharray = "176"; circ.style.strokeDashoffset = (176 * (1 - u)).toFixed(1); rg.style.opacity = u > 0 ? 1 : 0;
    // 字幕：大字不變，只換小字
    const [sa, sub, sd] = subAt(t);
    L.caps(t, [[0.6, D - 0.4, MAIN, t >= (sd || sa) ? sub : ""]]);
    const dip = Math.max(0, ...SUBS.slice(1).map(([a]) => 1 - C(Math.abs(t - a) / 0.3)));
    $("capS").style.opacity = (C((t - (sd || sa)) / 0.35) * (1 - dip)).toFixed(3);
    L.illus(t, [[3.6, D, "示意：每段對話用了多少，比例不是實測"]]);
    L.stageFade(t, { in: true, out: true });
  }
  L.start("07 習慣一：一件事一段對話", D, render);
})();
</script>
</body>
</html>
