<title>08 習慣二：寫進檔案</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
<link rel="stylesheet" href="../common/compare.css">
<style>
  /* 檔案卡（存在電腦上的檔案）：上面 decisions.md、下面 AGENTS.md */
  .fcard { position: absolute; left: 1330px; width: 542px; background: #161b22; border: 1px solid #3a4556; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .fcard .hd { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #2b3646; font-size: 24px; color: #aeb8c6; white-space: nowrap; }
  .fcard .hd svg { width: 22px; height: 22px; fill: none; stroke: #aeb8c6; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .fcard .hd b { color: #e6e6e6; font-weight: 700; font-family: "Cascadia Mono", monospace; }
  .fcard .bd { padding: 14px 20px 18px; font-family: "Cascadia Mono", "Noto Sans TC", monospace; font-size: 24px; line-height: 1.55; color: #d4d4d4; }
  .fcard .ln { white-space: nowrap; }
  .fcard .ln.c { color: #6f7a8c; }
  .fcard .ln u { text-decoration: none; background: linear-gradient(#f0b545, #f0b545) 0 100% / calc(100% * var(--ul, 0)) 3px no-repeat; padding-bottom: 2px; }
  .fcard .ring { position: absolute; inset: 0; border: 3px solid #f0b545; border-radius: 10px; opacity: 0; pointer-events: none; }
  #fcD { top: 150px; }
  #fcA { top: 430px; }
  #rd8 { position: absolute; font-size: 24px; color: #8a95a6; white-space: nowrap; }
  #rdA path { fill: none; stroke: #8a95a6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
</style>

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script src="../common/compare.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp, cx = K.cx;
  const FILE = '<svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg>';
  // decisions.md 的內容（示意，自己編的）；AGENTS.md：原本的規則＋做法一加的＋做法二加的
  const DEC_LINES = ["# 決定紀錄", "- 缺考的人不算進平均", "  （3 人：S05、S14、S22）", "- 平均取到小數一位", "- 圖一律用藍色系"];
  const CARDS = `<div class="fcard" id="fcD"><div class="hd">${FILE}<span>Project /</span><b>decisions.md</b></div><div class="bd">` +
    DEC_LINES.map((l, i) => `<div class="ln${i ? "" : " c"}" id="dl${i}">${l.replace(/ /g, "&nbsp;")}</div>`).join("") + `</div><div class="ring" id="dRing"></div></div>` +
    `<div class="fcard" id="fcA"><div class="hd">${FILE}<span>Project /</span><b>AGENTS.md</b></div><div class="bd">` +
    `<div class="ln" id="al0">- 用繁體中文回答</div><div class="ln" id="al1"><u id="au1">- 缺考的人不算進平均</u></div>` +
    `<div class="ln" id="al2"><u id="au2">- 每次開工前，先讀 decisions.md，</u></div><div class="ln" id="al3"><u id="au3">&nbsp;&nbsp;照裡面的決定做</u></div></div></div>` +
    `<div id="rd8">讀進來</div><svg id="rdA" style="position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible"><path id="rdP" d=""/></svg>`;
  L.mount({ world: CARDS, boards: CMP.html("新對話畫的") });
  const D = 37;
  // 第 2 版：兩種做法，重點是在 AGENTS.md 要求每次都讀
  //   A 做法一（0–8.2）：短的規則直接寫進 AGENTS.md
  //   B 做法二（8.2–19.0）：比較多的決定寫在 decisions.md，並在 AGENTS.md 加一句「每次開工前，先讀 decisions.md」
  //   C 新對話（19.0–31.0）：先讀 AGENTS.md → 照它讀 decisions.md（活動紀錄「Read files」）→ 畫圖
  //   D 對上了（31.0–37）：數字和 report.md 一樣；缺考不算、小數一位、藍色系都照 decisions.md
  const RULE1 = "把「缺考的人不算進平均」寫進 AGENTS.md", RULE2 = "其他決定寫進 decisions.md，並在 AGENTS.md 要它每次先讀", ASK = "幫我畫一張各班平均的圖";
  const TA0 = 0.6, SA = 2.4, TB0 = 8.2, SB = 10.6, NEWCHAT = 19.0, F1 = 19.8, F2 = 20.4, TC0 = 21.0, SC = 21.8, BOARD = 31.0, CHECK = 33.0;
  const EX05 = [["模型", "請幫我寫 <code>class_avg.py</code>"], ["結果", "已寫入 class_avg.py"], ["模型", "請幫我跑 <code>class_avg.py</code>"], ["結果", "A 64.8、B 65.4、C 58.6"], ["模型", "畫好了：class_avg.png"]];
  const OLD_EX = EX05.map((s) => ({ a: -1, s })).concat([
    { a: SA + 0.2, s: ["小安", "把規則寫進 AGENTS.md"] }, { a: 3.4, s: ["模型", "請幫我改 <code>AGENTS.md</code>"] }, { a: 3.8, s: ["結果", "已更新 AGENTS.md"] }, { a: 4.2, s: ["模型", "寫好了"] },
    { a: SB + 0.2, s: ["小安", "決定寫進 decisions.md…"] }, { a: 11.6, s: ["模型", "請幫我寫 <code>decisions.md</code>"] }, { a: 12.0, s: ["結果", "已寫入 decisions.md"] },
    { a: 12.8, s: ["模型", "請幫我改 <code>AGENTS.md</code>"] }, { a: 13.2, s: ["結果", "已更新 AGENTS.md"] }, { a: 13.8, s: ["模型", "好了"] }]);
  const FRESH = [["說明書", "Codex 的工作說明"], ["AGENTS.md", "<u>先讀 decisions.md</u>…"], ["小安", ASK], ["模型", "請幫我讀 <code>decisions.md</code>"],
    ["結果", "decisions.md 的 3 條決定"], ["模型", "請幫我跑 <code>python3 plot.py</code>"], ["結果", "A 74.0、B 74.7、C 67.0"], ["模型", "畫好了：class_avg.png"]];
  const FADDS = [[F1, 1], [F2, 2], [SC + 0.2, 3], [22.8, 4], [23.2, 5], [25.0, 6], [25.6, 7], [26.2, 8]];
  const CAPS = [
    [0.8, 8.0, "做法一：短的規則，直接寫進 AGENTS.md", "Codex 每段對話一開始，都會讀 AGENTS.md（Week 3 學過）", 5.8],
    [8.4, 14.4, "做法二：比較多的決定，寫在另一個檔案", "例如 decisions.md（檔名可以自己取）", 10.8],
    [14.6, 19.2, "在 AGENTS.md 要求：每次開工前，先讀它", "Codex 不會自己去讀其他檔案，要指名（Week 5 影片 01 講過）", 16.6],
    [19.4, 25.6, "開新對話：先讀 AGENTS.md，再照它讀 decisions.md", ""],
    [25.8, 30.8, "重要的事寫進檔案，並在 AGENTS.md 要求每次都讀", "檔案不會被壓縮", 27.6],
    [31.2, 36.6, "數字和 report.md 對上了", "缺考不算、小數一位、藍色系：都照 decisions.md", 34.4],
  ];
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]); L.scrims(0); L.dim(0);
    L.sec(t, "08", "習慣二：重要的事寫進檔案", 0.1);
    L.clock(17 * 60 + 40 + lerp(0, 12, C(t / 26)), C(t / 0.5));
    const fresh = t >= NEWCHAT;
    if (!fresh) {
      // 舊對話「分析成績」：接第 5 段結尾，再請它把規則寫進 AGENTS.md、建 decisions.md
      L.thread(t, { title: "分析成績", items: L.hist(L.H01(), L.S2ITEMS(), L.H03(true), L.H05()).concat([
        ["u5", L.user(RULE1), SA], ["w5", L.work(t >= 4.2, "Worked for 9s"), SA + 0.3], ["e1", L.tr("pencil", "Edited AGENTS.md"), 3.4],
        ["f5", L.agent(`已寫進 ${cx.file("AGENTS.md")}：缺考的人不算進平均。`), 4.2],
        ["u6", L.user(RULE2), SB], ["w6", L.work(t >= 13.8, "Worked for 15s"), SB + 0.3], ["e2", L.tr("pencil", "Created decisions.md"), 11.6], ["e3", L.tr("pencil", "Edited AGENTS.md"), 12.8],
        ["f6", L.agent(`建好了 ${cx.file("decisions.md")}，也在 ${cx.file("AGENTS.md")} 加上「每次開工前，先讀 decisions.md」。`), 13.8]]),
        input: (tt) => (tt >= TA0 && tt < SA ? K.typed(RULE1, tt, TA0, RULE1.length / 1.7) : tt >= TB0 && tt < SB ? K.typed(RULE2, tt, TB0, RULE2.length / 2.3) : "") });
      const A = L.afterItems(t, OLD_EX);
      A.items.forEach((s) => { s.alpha = (s.alpha == null ? 1 : s.alpha) * (1 - C((t - (NEWCHAT - 0.6)) / 0.6)); });
      L.draw(A.items); L.count(A.n, 1 - C((t - (NEWCHAT - 0.6)) / 0.6));
    } else {
      // 新對話「畫各班平均」：最下面說明書、第二張 AGENTS.md；照 AGENTS.md 先讀 decisions.md
      L.thread(t, { title: "畫各班平均", chats: ["分析成績", "課程問卷報告"], empty: true,
        items: [["tm", cx.time("Today 5:52 PM"), SC], ["u1", L.user(ASK), SC], ["w", L.work(t >= 26.2, "Worked for 44s"), SC + 0.3],
          ["a1", L.agent(`照 ${cx.file("AGENTS.md")}，先讀 decisions.md。`), 22.4], ["r1", L.tr("file", "Read files"), 22.8], ["x1", `<div class="exp">decisions.md</div>`, 22.8],
          ["r2", L.tr("termBox", "Ran commands"), 25.0],
          ["fin", L.agent(`畫好了 ${cx.file("class_avg.png")}：A 班 74.0、B 班 74.7、C 班 67.0（缺考不算、小數一位、藍色系）。`), 26.2]],
        input: (tt) => (tt >= TC0 && tt < SC ? K.typed(ASK, tt, TC0, ASK.length / 0.8) : "") });
      L.stack(t, 0, FADDS, { slips: FRESH });
    }
    L.panel(t, -1, 40); K.vis($("ctx"), 0);                     // 這段不放面板，右邊放兩個檔案
    L.folder(t, [["AGENTS.md", -1, t >= 3.8 ? 1e9 : -2], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", -1], ["scatter.png", -1], ["merge.py", -1], ["class_avg.png", -1], ["decisions.md", 12.0, 1e9]]);
    // 檔案卡：AGENTS.md（做法一出現）、decisions.md（做法二出現）
    K.vis($("fcA"), C((t - 3.8) / 0.4)); $("fcA").style.transform = `translateY(${((1 - K.easeOut((t - 3.8) / 0.5)) * 14).toFixed(1)}px)`;
    $("au1").style.setProperty("--ul", (L.seg(t, 4.2, 5.0) * (1 - L.seg(t, 13.4, 14.0))).toFixed(3));
    ["al2", "al3"].forEach((id) => { $(id).style.opacity = C((t - 13.2) / 0.3); });
    ["au2", "au3"].forEach((id, i) => $(id).style.setProperty("--ul", L.seg(t, 13.4 + i * 0.5, 14.0 + i * 0.5).toFixed(3)));
    K.vis($("fcD"), C((t - 12.0) / 0.4)); $("fcD").style.transform = `translateY(${((1 - K.easeOut((t - 12.0) / 0.5)) * 14).toFixed(1)}px)`;
    DEC_LINES.forEach((_, i) => { $("dl" + i).style.opacity = C((t - (12.1 + i * 0.25)) / 0.3); });
    $("dRing").style.opacity = (L.seg(t, 23.2, 23.6) * (1 - L.seg(t, 29.6, 30.2))).toFixed(3);   // 新對話讀 decisions.md 的那一下
    // 新對話：AGENTS.md 檔案 → 紙條堆裡第二張（讀進來）
    const ry = L.P.stack.y + L.lay(Math.max(2, L.stackState(t, 0, FADDS).n))[1].y + L.SH / 2, ra = fresh ? C((t - (F2 + 0.4)) / 0.4) * (1 - C((t - 30.0) / 0.4)) : 0;
    $("rdP").setAttribute("d", `M1326 ${ry.toFixed(1)} L1262 ${ry.toFixed(1)} M1274 ${(ry - 9).toFixed(1)} L1261 ${ry.toFixed(1)} L1274 ${(ry + 9).toFixed(1)}`);
    $("rdA").style.opacity = ra; K.vis($("rd8"), ra); $("rd8").style.left = "1258px"; $("rd8").style.top = (ry - 44) + "px";
    // 並排比較：數字和 report.md 一樣，打勾；小安開心
    const b = C((t - BOARD) / 0.5);
    $("world").style.opacity = (C(t / 0.5) * (1 - 0.97 * b)).toFixed(3);
    CMP.render(t, { on: b, a: BOARD, fresh: [74.0, 74.7, 67.0], circles: null, check: CHECK });
    const hap = t >= CHECK + 0.4;
    L.fox("foxO", 1690, 1040, 0.9, "front", { alpha: C((t - BOARD - 0.4) / 0.5), expr: hap ? "happy" : "curious", look: -0.45,
      nod: hap ? 0.3 * Math.max(0, Math.sin(C((t - CHECK - 0.4) / 0.7) * Math.PI)) + 0.3 * Math.max(0, Math.sin(C((t - 35.4) / 0.7) * Math.PI)) : 0 });
    L.caps2(t, CAPS);
    L.illus(t, [[0, D, "情境是示意；decisions.md 這個檔名可以自己取"]]);
    L.stageFade(t, { out: true });
  }
  L.start("08 習慣二：寫進檔案", D, render);
})();
</script>
