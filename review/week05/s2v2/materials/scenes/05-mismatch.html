<title>05 記錯了</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
<link rel="stylesheet" href="../common/compare.css">
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script src="../common/compare.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp;
  const GHOST = `<div class="ghost" id="ghost"><div class="lb">那則決定（第 1 段）</div><div style="position:relative"><div class="slip"><span class="k">模型</span><span class="v">${L.S1[3][1]}</span></div><div class="tab" style="left:378px;top:18px"></div></div></div>`;
  L.mount({ boards: CMP.html("新的圖：缺考算成 0 分") + GHOST });
  const D = 18;
  // 壓縮之後，Codex 接著畫「各班平均」：這次缺考的 3 人被算成 0 分。和 report.md 並排，三班都對不起來（琥珀圈）。
  // 第 2 版：砍掉停頓。report.md 晚一點出現「缺考的 3 人不算進平均」那行；最後「那則決定」的紙條出現、慢慢淡掉
  const EX = [[0.6, ["模型", "請幫我寫 <code>class_avg.py</code>"]], [1.1, ["結果", "已寫入 class_avg.py"]], [1.6, ["模型", "請幫我跑 <code>class_avg.py</code>"]],
    [2.1, ["結果", "A 64.8、B 65.4、C 58.6"]], [2.6, ["模型", "畫好了：class_avg.png"]]].map(([a, s]) => ({ a, s }));
  const BOARD = 3.0, CIRC = [5.2, 5.6, 6.0], NOTE = 9.2, GH0 = 11.8, GH1 = 14.0;
  const CAPS = [
    [3.4, 7.4, "新的圖，和 report.md 對不起來", ""],
    [7.6, 11.4, "新的圖把缺考的 3 人算成 0 分", "report.md 那時是「不算進平均」", NOTE],
    [11.6, 17.4, "它不是故意的：那個決定，可能在壓縮時掉了。", ""],
  ];
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]); L.scrims(0); L.dim(0);
    L.sec(t, "05", "記錯了", 0.1);
    L.clock(17 * 60 + 30 + lerp(0, 2, C(t / 3)));
    const done = t >= 2.6, h05 = L.H05();
    L.thread(t, { title: "分析成績", items: L.hist(L.H01(), L.S2ITEMS(), L.H03(done)).concat([[...h05[0], 0.6], [...h05[1], 1.6], [...h05[2], 2.6]]) });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", -1], ["scatter.png", -1], ["merge.py", -1], ["class_avg.png", 2.6]]);
    const A = L.afterItems(t, EX);
    L.draw(A.items); L.count(A.n);
    L.panel(t, -1, lerp(33, 38, C((t - 0.6) / 2.4)));
    // 並排比較（說明板）：世界退暗
    const b = C((t - BOARD) / 0.5);
    $("world").style.opacity = (1 - 0.97 * b).toFixed(3);
    CMP.render(t, { on: b, a: BOARD, fresh: [64.8, 65.4, 58.6], circles: CIRC, check: null, note: NOTE });
    // 那則決定：出現，再慢慢淡掉（往下沉一點）
    const g = C((t - GH0) / 0.5) * (1 - L.seg(t, GH1, GH1 + 1.4));
    K.vis($("ghost"), g); $("ghost").style.transform = `translateY(${(L.seg(t, GH1, GH1 + 1.4) * 18).toFixed(1)}px)`;
    $("ghost").style.filter = t > GH1 ? `grayscale(${L.seg(t, GH1, GH1 + 1.0).toFixed(3)})` : "";
    // 小安：先好奇地看，琥珀圈出現時嚇一跳；那則決定淡掉時，又好奇地歪頭
    const sur = t >= CIRC[0] + 0.2 && t < GH1 + 1.2;
    L.fox("foxO", 1690, 1040, 0.9, "front", { alpha: C((t - BOARD - 0.4) / 0.5), expr: sur ? "surprised" : "curious", look: -0.45, tilt: sur ? 0 : -0.06, blink: !sur && Math.floor(t * 10) % 41 === 0 });
    L.caps2(t, CAPS);
    L.illus(t, [[0, D, "情境是示意：資料、班級、數字都是假的"]]);
    L.stageFade(t, { out: true });   // 淡到全黑，接第 6 段
  }
  L.start("05 記錯了", D, render);
})();
</script>
</body>
</html>
