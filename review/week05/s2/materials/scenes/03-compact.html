<title>03 自動壓縮</title>

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp;
  L.mount();
  const D = 28;
  // 整支最重要的畫面（分鏡第 2 版的測試片，停住的那段縮短 2 秒）。秒數也是聲音的時間表（audio/）
  const T = {
    type0: 0.6, send: 2.4, push0: 2.6, push1: 4.2, row: 3.4, pull0: 8.2, pull1: 9.8,
    n0: 10.0, n1: 11.5, g1: 14.5, p1: 16.5, s0: 16.5, sStep: 0.25, sDur: 1.1, new0: 18.1, new1: 19.0, done: 18.5,
    pan0: 14.5, pan1: 18.5, bars0: 16.6, bars1: 17.6, in0: 25.2, in1: 28.0,
  };
  window.T3 = T;
  const END = [1000, 555, 1.25];                 // 第 4 段從這裡接著推近精簡版
  const CAM = [[0, ...L.WIDE], [T.push0, ...L.WIDE], [T.push1, ...L.PUSH], [T.pull0, ...L.PUSH], [T.pull1, ...L.WIDE], [T.in0, ...L.WIDE], [T.in1, ...END]];
  const CAPS = [
    [3.0, 8.4, "快滿了，Codex 會自動壓縮", "Week 3 看過：滿了會壓縮"],
    [10.4, 18.8, "前面的對話，換成一份比較短的精簡版", ""],
    [19.0, 25.0, "換成精簡版，再繼續", "最上面幾則還在。精簡版寫了什麼，app 裡看不到。"],
  ];
  const LATE = [["tm", K.cx.time("Today 5:12 PM"), -1], ["u1", L.user("把圖的標題改大一點"), -1], ["a1", L.agent("已把標題改成 28 pt。"), -1],
    ["u2", L.user("第二節改短一點"), -1], ["a2", L.agent("已改短第二節。"), -1], ["u3", L.user("顏色換成藍色系"), -1], ["a3", L.agent("已換成藍色系。"), -1]];
  function render(t) {
    const cam = L.cam(t, CAM), k = t < T.in0 ? L.pushK(cam.z) : 0;
    L.scrims(k); L.dim(k);
    L.sec(t, "03", "自動壓縮", 0.1);
    L.clock(17 * 60 + 30);
    // Codex：送出後 Working…；活動紀錄一列「Compacting context」（app 程式裡的字串）→「Context automatically compacted」（老師的截圖）
    L.thread(t, {
      title: "分析成績",
      items: LATE.concat([["u4", L.user(L.NEW[1]), T.send], ["w", L.work(false), T.send + 0.3],
        ["row", L.tr("compact", t < T.done ? "Compacting context" : "Context automatically compacted"), T.row]]),
      input: (tt) => (tt < T.send ? K.typed(L.NEW[1], tt, T.type0, 9) : ""),
    });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", -1], ["scatter.png", -1], ["merge.py", -1]]);
    L.panel(t, -1, lerp(95, 33, L.seg(t, T.pan0, T.pan1)));
    const s = L.compactState(t, T);
    L.draw(s.items); L.count(s.n, 1 - C((t - T.in0) / 0.6));
    L.label("foundL", t, T.n0, T.in0 + 0.6, "說明書、AGENTS.md", 1262, L.P.stack.y + s.foundTop - 6);
    L.caps(t, CAPS);
    L.illus(t, [[0, T.in0 + 0.6, L.ILLUS]]);
  }
  L.start("03 自動壓縮", D, render);
})();
</script>
</body>
</html>
