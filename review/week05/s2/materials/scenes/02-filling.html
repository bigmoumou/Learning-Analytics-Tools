<title>02 越來越滿</title>

<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp;
  L.mount();
  const D = 18;
  // 時間快轉：14:04 → 17:30。一張張疊上去（14 → 42 張），舊的壓成紙邊、再變薄；決定那張的琥珀小標籤一直露在旁邊。面板 40% → 95%
  const T0 = 1.0, STEP = 0.54;
  const ADDS = L.S2.map((_, j) => [T0 + j * STEP, L.N1 + j + 1]);
  const T_END = T0 + (L.S2.length - 1) * STEP;
  // 對話（快轉）：小安的話、模型的回覆照紙條的時間出現；中間的工具呼叫畫成活動紀錄的一列
  const items = [["tm", K.cx.time("Today 2:00 PM"), -1], ["dec", L.agent(L.DECISION), -1], ["ok", L.user("好"), -1], ["w0", K.cx.worked("Worked for 1m 12s"), -1],
    ["fin0", L.agent(`已畫好散佈圖 ${K.cx.file("scatter.png")}，各班平均寫進 ${K.cx.file("report.md")}（缺考的 3 人不算進平均）。`), -1]];
  L.S2.forEach(([who, v], j) => {
    const a = T0 + j * STEP, txt = v.replace(/<[^>]+>/g, "");
    if (who === "小安") items.push(["u" + j, L.user(txt), a]);
    else if (who === "模型" && !txt.startsWith("請幫我")) items.push(["a" + j, L.agent(txt + "。"), a]);
    else if (who === "模型") items.push(["r" + j, L.tr(txt.includes("跑") ? "termBox" : "pencil", txt.includes("跑") ? "Ran commands" : "Edited files"), a]);
  });
  const CAPS = [[1.0, 17.6, "同一段對話裡，一直做下去", ""]];
  function render(t) {
    L.cam(t, [[0, ...L.WIDE]]); L.scrims(0); L.dim(0);
    L.sec(t, "02", "越來越滿", 0.1);
    L.clock(14 * 60 + 4 + (17 * 60 + 30 - (14 * 60 + 4)) * E(C((t - 0.6) / (T_END - 0.2))));
    L.thread(t, { title: "分析成績", items });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", -1], ["scatter.png", -1], ["merge.py", T0 + 14 * STEP]]);
    L.stack(t, L.N1, ADDS);
    L.panel(t, -1, lerp(40, 95, C((t - T0) / (T_END - T0 + 0.4))));
    L.caps(t, CAPS);
    L.illus(t, [[0, D, L.ILLUS]]);
  }
  L.start("02 越來越滿", D, render);
})();
</script>
