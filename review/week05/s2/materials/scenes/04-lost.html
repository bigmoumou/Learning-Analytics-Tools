<title>04 掉了什麼</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/s2.css">
<style>
  #lost { position: absolute; left: 1130px; top: 250px; width: 720px; }
  #lost .h { font-size: 30px; color: #aeb8c6; font-weight: 700; white-space: nowrap; }
  #lost .it { padding: 22px 0 22px; border-bottom: 1px solid #2b3646; }
  #lost .it:first-of-type { margin-top: 18px; border-top: 1px solid #2b3646; }
  #lost .a { font-size: 44px; font-weight: 900; color: #fff; white-space: nowrap; }
  #lost .b { margin-top: 6px; font-size: 26px; color: #8a95a6; white-space: nowrap; }
</style>

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/s2.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$, lerp = K.lerp;
  const LOST = [["為什麼這樣決定", "例如：缺考的 3 人先不算進平均"], ["確切的欄位名稱", "例如：score、hours_per_week"], ["某次算出來的數字", "例如：各班平均"]];
  L.mount({ boards: `<div id="lost"><div class="h">可能掉的細節</div>` + LOST.map(([a, b], i) => `<div class="it" id="lo${i}"><div class="a">${a}</div><div class="b">${b}</div></div>`).join("") + `</div>` });
  const D = 22;
  // 接第 3 段：鏡頭推近精簡版（只有灰線，沒有琥珀），旁邊列三種可能掉的細節；最後拉回全景
  const A = L.afterItems(0);
  const sum = A.items.find((s) => s.sum), sy = L.P.stack.y + sum.y + L.SUMH / 2;
  const Z = 1.8, CLOSE = [1026 + 380 / Z, sy + 90 / Z, Z];
  const CAM = [[0, 1000, 555, 1.25], [2.0, ...CLOSE], [18.8, ...CLOSE], [21.0, ...L.WIDE]];
  const IT = [5.0, 6.8, 8.6];
  const CAPS = [[2.4, 10.4, "精簡版留的是重點，前面的細節可能就不在了", ""], [10.8, 18.8, "細節不在了，模型就可能「記錯」", ""]];
  function render(t) {
    const cam = L.cam(t, CAM), close = C((cam.z - 1) / (Z - 1));
    L.scrims(0);
    // 推近時，Codex、資料夾、面板淡下去，只留紙條
    ["app", "folder", "zMac"].forEach((id) => { $(id).style.opacity = (1 - 0.85 * close).toFixed(3); });
    $("ctx").style.filter = close > 0.001 ? `opacity(${(1 - C(close / 0.4)).toFixed(3)})` : "";   // 面板先淡掉，不會壓到時鐘
    L.sec(t, "04", "掉了什麼", 0.1);
    L.clock(17 * 60 + 30);
    L.thread(t, { title: "分析成績", items: [["u4", L.user(L.NEW[1]), -1], ["w", L.work(false), -1], ["row", L.tr("compact", "Context automatically compacted"), -1]] });
    L.folder(t, [["AGENTS.md", -1], ["grades.csv", -1], ["survey.csv", -1], ["analyze.py", -1], ["report.md", -1], ["plot.py", -1], ["scatter.png", -1], ["merge.py", -1]]);
    L.panel(t, -1, 33);
    L.draw(A.items); L.count(A.n, C((t - 19.6) / 0.6));
    // 可能掉的細節：一條一條出現
    K.vis($("lost"), C((t - 4.2) / 0.4) * (1 - C((t - 18.6) / 0.5)));
    LOST.forEach((_, i) => K.rise($("lo" + i), t, IT[i], 1e9, 16));
    L.caps(t, CAPS);
    L.illus(t, [[2.4, D, "情境是示意；精簡版寫了什麼，app 裡看不到，這裡只畫灰線"]]);
  }
  L.start("04 掉了什麼", D, render);
})();
</script>
</body>
</html>
