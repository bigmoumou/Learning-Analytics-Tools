<title>09 結尾</title>

<link rel="stylesheet" href="../common/v01.css">
<style>
  #end { position: absolute; left: 96px; top: 300px; }
  #end .a, #end .b { font-size: 76px; font-weight: 900; line-height: 1.3; color: #fff; white-space: nowrap; }
  #end .b em, #end .a em { font-style: normal; font-family: "Cascadia Mono", monospace; font-weight: 700; font-size: .9em; }
  #end .b { color: #f0b545; }
  #end .rule { margin-top: 40px; width: 980px; height: 2px; background: #3a4556; transform-origin: 0 50%; }
  /* 第 2 版：結尾前先回顧（老師的 5 個重點縮成 4 行），再收在一句話 */
  #rc { position: absolute; left: 96px; top: 170px; }
  #rc .h { font-size: 34px; font-weight: 700; color: #aeb8c6; margin-bottom: 26px; }
  #rc .r { display: flex; gap: 24px; align-items: baseline; font-size: 46px; font-weight: 800; line-height: 1.35; color: #fff; white-space: nowrap; margin-bottom: 26px; }
  #rc .r i { font-style: normal; font-family: "Cascadia Mono", monospace; color: #f0b545; font-size: 40px; }
  #rc .r small { display: block; font-size: 30px; font-weight: 400; color: #aeb8c6; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../../src/fox2.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  const RC = [
    ["「做好了」是它自己判斷的", "沒寫清楚的地方，每次可能不一樣"],
    ["怎樣算做好，寫進 VERIFY.md", "看得到、數得出來：12 個標記、寬 390 px"],
    ["AGENTS.md 加上那一句", "每次做完一個新功能，都要把 VERIFY.md 完整驗證一次"],
    ["自己抽查，清單越寫越好", "發現新的問題，就加一條"],
  ];
  L.mount({ boards: `<div id="rc"><div class="h" id="rch">記住這幾件事</div>${RC.map(([a, b], i) => `<div class="r" id="rc${i}"><i>${i + 1}</i><span>${a}<small>${b}</small></span></div>`).join("")}</div>` +
    `<div id="end"><div class="a" id="ea"><em>AGENTS.md</em> 寫長期協作規則，</div><div class="b" id="eb"><em>VERIFY.md</em> 寫怎樣算做好。</div><div class="rule" id="er"></div></div>` });
  ["zMac", "zSrv", "app", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  const D = 14;
  const R0 = 0.5, RD = 1.8, OUT = 8.0, EA = 8.6, EB = 9.6, ER = 10.4, NOD = 10.8;
  function render(t) {
    V.dip(t, D, 0.5);
    L.cam(t, [[0, ...L.WIDE]]);
    // 回顧：四行一行一行出現，接著淡出
    const out = 1 - C((t - OUT) / 0.4);
    K.vis($("rch"), C((t - 0.2) / 0.3) * out);
    RC.forEach((_, i) => { K.rise($("rc" + i), t, R0 + i * RD, 1e9, 18); $("rc" + i).style.opacity = (C((t - R0 - i * RD) / 0.35) * out).toFixed(3); });
    // 收在一句話
    K.rise($("ea"), t, EA, 1e9, 18);
    K.rise($("eb"), t, EB, 1e9, 18);
    $("er").style.transform = `scaleX(${E((t - ER) / 0.8).toFixed(4)})`;
    const nod = Math.max(0, Math.sin(C((t - NOD) / 0.6) * Math.PI)) * 0.4;
    L.fox("foxO", 1600, 860, 1.25, "front", { alpha: C((t - 0.8) / 0.5), look: -0.35, nod, expr: "happy", blink: Math.floor(t * 10) % 41 === 0 });
  }
  L.start("09 結尾", D, render);
})();
</script>
</body>
