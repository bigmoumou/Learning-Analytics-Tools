<title>05 接上 AGENTS.md</title>
<link rel="stylesheet" href="../../assets/kit/kit.css">
<link rel="stylesheet" href="../../assets/kit/codex.css">
<link rel="stylesheet" href="../common/loop.css">
<link rel="stylesheet" href="../common/v01.css">
<style>
  #ag { left: 80px; top: 150px; width: 1140px; }
  #vm { left: 1290px; top: 210px; width: 520px; }
  #lk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  #lk path { fill: none; stroke: #f0b545; stroke-width: 3; }
  /* 第 2 版：老師指定的那一句放大、加粗（一定要寫的一句） */
  #ag .ln.add { font-size: 31px; font-weight: 800; line-height: 1.6; padding-top: 16px; padding-bottom: 16px; white-space: nowrap !important; }
  #ag .ln.add u { transition: none; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="../../assets/kit/kit.js"></script>
<script src="../common/spots.js"></script>
<script src="../common/loop.js"></script>
<script src="../common/v01.js"></script>
<script>
(function () {
  const C = K.clamp, E = K.ease, $ = L.$;
  L.mount({ world: `<div class="sheet" id="ag"></div><div class="sheet mini" id="vm"></div><svg id="lk"><path id="lkP" d=""/></svg>` });
  ["zMac", "zSrv", "app", "folder", "net", "netL", "srv", "stack", "stackN"].forEach((id) => K.vis($(id), 0));
  const D = 22;
  // 第 2 版：加的那一句換成老師指定的原文，並且特別強調：
  // 鏡頭推近那一句 → 琥珀底線跟著讀的速度從左畫到右（5 秒）→ 字幕「一定要寫的一句」→ 拉回全景，細線接到驗收單 → 最後再推近一次
  const ADD = 1.0, PUSH0 = 1.2, PUSH1 = 2.2, UL0 = 2.4, UL1 = 7.4, VW = 7.8, PULL0 = 8.6, PULL1 = 9.4, VM = 9.4, LINK0 = 10.0, LINK1 = 11.2, SUB3 = 11.6, SUB4 = 15.2, RE0 = 18.0, RE1 = 19.6;
  const Z = 1.3;
  const CAPS = [
    [0.4, 3.6, "在 AGENTS.md 加上這一句", ""],
    [3.9, 8.8, "<em>一定要寫的一句</em>", V.ADD_TEXT],
    [9.2, 13.4, "Codex 每段對話一開始會讀 AGENTS.md", "但不會自己去找 VERIFY.md"],
    [13.8, 17.6, "所以要在 AGENTS.md 指名 VERIFY.md", "指名了，它才會去讀 VERIFY.md"],
    [18.0, D - 0.3, "<em>一定要寫的一句</em>", V.ADD_TEXT],
  ];
  let tgt = null;   // 那一句在 #world 裡的中心（第一次 render 時量一次）
  function render(t) {
    V.dip(t, D);
    if (!tgt) { V.agents($("ag"), { add: 1, ul: 0 }); const r = L.wr($("agAdd")); tgt = [r.x + r.w / 2, r.y + r.h / 2]; }
    const cam = L.cam(t, [[0, ...L.WIDE], [PUSH0, ...L.WIDE], [PUSH1, tgt[0], tgt[1], Z], [PULL0, tgt[0], tgt[1], Z], [PULL1, ...L.WIDE], [RE0, ...L.WIDE], [RE1, tgt[0], tgt[1], Z]]);
    L.scrims(C((cam.z - 1) / (Z - 1)));
    L.sec(t, "05", "接上 AGENTS.md");
    V.agents($("ag"), { add: t >= ADD ? C((t - ADD) / 0.6) : 0, ul: C((t - UL0) / (UL1 - UL0)) });   // 等速：跟著讀的速度
    $("ag").style.transform = "rotate(-0.4deg)";
    const a = $("agAdd");
    if (a) a.style.transform = `translateY(${((1 - K.easeOut((t - ADD) / 0.5)) * 12).toFixed(1)}px)`;
    // 底線畫完，「VERIFY.md」變成琥珀色（下一步要接到驗收單）
    const u = a && a.querySelector("u");
    if (u) { const w = C((t - VW) / 0.4); u.style.color = w > 0 ? `rgb(${Math.round(29 + (185 - 29) * w)},${Math.round(35 + (125 - 35) * w)},${Math.round(44 + (22 - 44) * w)})` : ""; }
    V.verify($("vm"));
    // 最後再推近時，驗收單和細線先淡出（不留半張在畫面邊緣）
    const reo = 1 - C((t - RE0) / 0.5);
    K.vis($("vm"), C((t - VM) / 0.4) * reo);
    $("vm").style.transform = `translateY(${((1 - K.spring(t - VM, 14, 0.85)) * 20).toFixed(1)}px) rotate(0.5deg)`;
    // 細線：長期協作規則那一行的「VERIFY.md」→ 驗收單的標題
    const lo = E((t - LINK0) / (LINK1 - LINK0));
    if (u && lo > 0) {
      const r = L.wr(u), v = L.wr($("vm").querySelector(".ttl"));
      // 從字的下面往下，沿著長期協作規則的下緣繞過去（不穿過字），再往上接到驗收單
      const ag = L.wr($("ag")), x0 = r.x + r.w / 2, y0 = r.y + r.h + 10, yb = ag.y + ag.h + 26, x1 = v.x - 16, y1 = v.y + v.h / 2, xm = x1 - 50;
      const p = $("lkP"); p.setAttribute("d", `M ${x0} ${y0} V ${yb - 20} Q ${x0} ${yb} ${x0 + 20} ${yb} H ${xm - 20} Q ${xm} ${yb} ${xm} ${yb - 20} V ${y1 + 20} Q ${xm} ${y1} ${xm + 20} ${y1} H ${x1}`);
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - lo); p.style.opacity = reo;
    } else $("lkP").style.opacity = 0;
    L.caps(t, CAPS);
    $("capS").style.opacity = t >= CAPS[2][0] && t < CAPS[3][0] ? C((t - SUB3) / 0.35).toFixed(3) : t >= CAPS[3][0] && t < CAPS[4][0] ? C((t - SUB4) / 0.35).toFixed(3) : "";
  }
  L.start("05 接上 AGENTS.md", D, render);
})();
</script>
</body>
</html>
